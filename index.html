<!DOCTYPE html>
<html>
<head>
<title>Sambhal PDF Bhai</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  background: #0d0d0d;
  color: white;
  font-family: Arial;
  text-align: center;
}
.container {
  margin: 20px auto;
  width: 300px;
  padding: 20px;
  background: #1a1a1a;
  border-radius: 10px;
}
button {
  background: #00ffcc;
  border: none;
  padding: 10px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
}
input, textarea {
  width: 100%;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🖤 Sambhal PDF Bhai</h1>

<div class="container">
  <h3>JPG → PDF</h3>
  <input type="file" id="jpgInput" multiple>
  <button onclick="convertJPG()">Convert</button>
</div>

<div class="container">
  <h3>PDF → JPG</h3>
  <p>⚠️ Browser me direct possible nahi</p>
</div>

<div class="container">
  <h3>Unicode → Krutidev</h3>
  <textarea id="textInput"></textarea>
  <button onclick="convertText()">Convert</button>
  <p id="output"></p>
</div>

<script>
async function convertJPG() {
  const { jsPDF } = window.jspdf;
  let pdf = new jsPDF();

  let files = document.getElementById("jpgInput").files;

  for (let i = 0; i < files.length; i++) {
    let imgData = await toBase64(files[i]);

    if (i > 0) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 10, 10, 180, 160);
  }

  pdf.save("sambhal.pdf");
}

function toBase64(file) {
  return new Promise((resolve) => {
    let reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// Basic Unicode → Krutidev
function convertText() {
  let text = document.getElementById("textInput").value;

  let result = text
    .replace(/क/g, "d")
    .replace(/ा/g, "k")
    .replace(/न/g, "u");

  document.getElementById("output").innerText = result;
}
</script>

</body>

</html>
