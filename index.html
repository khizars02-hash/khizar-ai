<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khizar AI Ultimate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  background: radial-gradient(circle,#0a0a0a,#000);
  color:white;
  overflow-x:hidden;
}

/* PARTICLES */
#particles{position:fixed;width:100%;height:100%;z-index:-1}

/* NAV */
nav{display:flex;justify-content:space-between;padding:20px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);}
nav h2{color:#d4af37;text-shadow:0 0 10px gold;}
nav a{color:white;margin-left:15px;text-decoration:none;}

/* HERO */
.hero{text-align:center;padding:80px 20px;}
.hero h1{font-size:50px;color:#d4af37;text-shadow:0 0 20px gold;}

/* BUTTON */
button{
  padding:10px 20px;
  border:none;
  background:#d4af37;
  color:black;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
}
button:hover{transform:scale(1.1);box-shadow:0 0 15px gold;}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  padding:20px;
  margin:10px auto;
  max-width:400px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(212,175,55,0.2);
}

/* CHATBOT */
.chatbox{
  position:fixed;
  bottom:20px;
  right:20px;
  width:300px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
}
.chat-header{background:#d4af37;color:black;padding:10px;}
.chat-body{height:200px;overflow:auto;padding:10px;font-size:14px;}
.chat-input{display:flex;}
.chat-input input{flex:1;padding:5px;border:none;}
.chat-input button{border-radius:0;}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<nav>
<h2>Khizar AI</h2>
<div>
<a href="#">Home</a>
<a href="#tools">Tools</a>
</div>
</nav>

<div class="hero">
<h1>Khizar AI</h1>
<p>Ultimate AI Tools Platform</p>
</div>

<!-- TOOLS -->
<section id="tools">

<div class="card">
<h3>Upload Image</h3>
<input type="file" id="fileInput"><br>
<button onclick="removeBG()">BG Remove</button>
<button onclick="enhance()">Enhance</button>
<button onclick="download()">Download</button>
</div>

<div class="card">
<h3>JPG to PDF</h3>
<button onclick="jpgToPdf()">Convert</button>
</div>

<div class="card">
<h3>Text to Audio</h3>
<input type="text" id="textAudio">
<button onclick="playAudio()">Play</button>
</div>

</section>

<!-- CHATBOT -->
<div class="chatbox">
<div class="chat-header">Mini AI</div>
<div class="chat-body" id="chatBody"></div>
<div class="chat-input">
<input type="text" id="chatInput">
<button onclick="sendChat()">Send</button>
</div>
</div>

<script>
// PARTICLES
const c=document.getElementById("particles"),ctx=c.getContext("2d");
c.width=window.innerWidth;c.height=window.innerHeight;
let p=[];for(let i=0;i<100;i++){p.push({x:Math.random()*c.width,y:Math.random()*c.height,dx:(Math.random()-0.5),dy:(Math.random()-0.5)});}
function anim(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="white";
p.forEach(e=>{e.x+=e.dx;e.y+=e.dy;ctx.fillRect(e.x,e.y,2,2);});
requestAnimationFrame(anim);}anim();

// FILE
let file;
document.getElementById("fileInput").addEventListener("change",e=>file=e.target.files[0]);

// 🔥 BG REMOVE (API READY)
async function removeBG(){
let api="yGmqAqS9ehuThJMVeBV6zxpC";
let form=new FormData();
form.append("image_file",file);

let res=await fetch("https://api.remove.bg/v1.0/removebg",{
method:"POST",
headers:{"X-Api-Key":api},
body:form
});
let blob=await res.blob();
downloadBlob(blob,"no-bg.png");
}

// 🔥 ENHANCE (DEEPAI)
async function enhance(){
let api="5cb86dcb-0059-4d2b-87b6-e08ee800c686";
let form=new FormData();
form.append("image",file);

let res=await fetch("https://api.deepai.org/api/torch-srgan",{
method:"POST",
headers:{"api-key":api},
body:form
});
let data=await res.json();
window.open(data.output_url);
}

// DOWNLOAD
function download(){
let link=document.createElement("a");
link.href=URL.createObjectURL(file);
link.download=file.name;
link.click();
}

function downloadBlob(blob,name){
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=name;
link.click();
}

// JPG TO PDF
function jpgToPdf(){
const { jsPDF } = window.jspdf;
let pdf=new jsPDF();
pdf.text("Image Added",10,10);
pdf.save("file.pdf");
}

// AUDIO
function playAudio(){
let text=document.getElementById("textAudio").value;
speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

// CHATBOT (basic AI)
function sendChat(){
let input=document.getElementById("chatInput").value;
let box=document.getElementById("chatBody");
box.innerHTML+="<p><b>You:</b> "+input+"</p>";

let reply="I am Khizar AI 🤖";
if(input.includes("hi")) reply="Hello 👋";
if(input.includes("ai")) reply="I am your AI assistant";

box.innerHTML+="<p><b>AI:</b> "+reply+"</p>";
}
</script>

</body>
</html>
