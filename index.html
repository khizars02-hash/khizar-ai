<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khizar AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  background: radial-gradient(circle at center, #0a0a0a, #000);
  color:white;
  overflow-x:hidden;
}

/* PARTICLES CANVAS */
#particles{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(10px);
}
nav h2{
  color:#d4af37;
  text-shadow:0 0 10px gold;
}
nav a{
  color:white;
  margin-left:15px;
  text-decoration:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
}
.hero h1{
  font-size:50px;
  color:#d4af37;
  text-shadow:0 0 20px gold;
}
.hero p{opacity:0.8;}

/* BUTTON */
button{
  padding:10px 20px;
  border:none;
  background:#d4af37;
  color:black;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  transform:scale(1.1);
  box-shadow:0 0 15px gold;
}

/* TOOL BOX */
.tool-box{
  text-align:center;
  padding:30px;
}
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  padding:20px;
  margin:10px auto;
  max-width:400px;
  border-radius:15px;
  box-shadow:0 0 20px rgba(212,175,55,0.2);
}

/* FAQ */
.faq h3{
  cursor:pointer;
  background:#111;
  padding:10px;
  margin-top:10px;
}
.faq p{
  display:none;
  padding:10px;
  background:#0f0f0f;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<nav>
  <h2>Khizar AI</h2>
  <div>
    <a href="#">Home</a>
    <a href="#tools">Tools</a>
    <a href="#faq">FAQ</a>
  </div>
</nav>

<div class="hero">
  <h1>Khizar AI</h1>
  <p>Next Gen AI Tools Experience</p>
</div>

<!-- TOOLS -->
<section id="tools" class="tool-box">

<div class="card">
<h3>Upload Image</h3>
<input type="file" id="fileInput"><br>
<button onclick="removeBG()">BG Remove</button>
<button onclick="enhance()">Enhance</button>
<button onclick="download()">Download</button>
</div>

<div class="card">
<h3>JPG to PDF</h3>
<button onclick="jpgToPdf()">Convert</button>
</div>

<div class="card">
<h3>Text to Audio</h3>
<input type="text" id="textAudio" placeholder="Enter text"><br>
<button onclick="playAudio()">Play</button>
</div>

</section>

<!-- FAQ -->
<section id="faq">
<h2 style="text-align:center;">FAQs</h2>
<div class="faq">
<h3 onclick="toggle(this)">What is Khizar AI?</h3>
<p>All-in-one AI tools platform.</p>

<h3 onclick="toggle(this)">Is it free?</h3>
<p>Yes, completely free.</p>
</div>
</section>

<script>
// PARTICLES ANIMATION
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    dx:(Math.random()-0.5)*1,
    dy:(Math.random()-0.5)*1
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";
  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;
    ctx.fillRect(p.x,p.y,2,2);
  });
  requestAnimationFrame(animate);
}
animate();

// FILE
let file;
document.getElementById("fileInput").addEventListener("change", e=>{
  file = e.target.files[0];
});

// DEMO FUNCTIONS
function removeBG(){alert("BG Remove needs API");}
function enhance(){alert("Enhance demo");}

function download(){
  if(!file) return alert("Upload file first");
  let link=document.createElement("a");
  link.href=URL.createObjectURL(file);
  link.download=file.name;
  link.click();
}

function jpgToPdf(){alert("PDF feature demo");}

function playAudio(){
  let text=document.getElementById("textAudio").value;
  let speech=new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(speech);
}

function toggle(el){
  let p=el.nextElementSibling;
  p.style.display=(p.style.display==="block")?"none":"block";
}
</script>

</body>
</html>
